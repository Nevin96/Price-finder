[project]
name = "project-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nevin Babu", email = "nevinbabu25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "firecrawl>=4.54.0",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.0",
    "mcp>=1.30.0",
    "pandas>=3.1.0",
    "playright>=0.1.1",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "serpapi>=1.1.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
project-mcp = "project_mcp:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
